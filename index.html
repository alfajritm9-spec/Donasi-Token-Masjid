<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donasi Token Listrik Masjid Alfajri</title>

  <style>
    body{
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg,#0f766e,#16a34a);
      margin:0;
      padding:20px;
    }

    .container{
      max-width:420px;
      margin:auto;
      background:white;
      padding:30px;
      border-radius:20px;
      box-shadow:0 10px 25px rgba(0,0,0,0.2);
      margin-top:40px;
    }

    h2{
      text-align:center;
      color:#0f766e;
      margin-bottom:25px;
    }

    label{
      font-weight:bold;
      display:block;
      margin-top:15px;
      color:#333;
    }

    input{
      width:100%;
      padding:14px;
      margin-top:6px;
      border:1px solid #ccc;
      border-radius:12px;
      font-size:16px;
      box-sizing:border-box;
    }

    button{
      width:100%;
      padding:15px;
      margin-top:25px;
      border:none;
      border-radius:12px;
      background:#16a34a;
      color:white;
      font-size:18px;
      font-weight:bold;
      cursor:pointer;
    }

    button:hover{
      background:#15803d;
    }

    .footer{
      text-align:center;
      margin-top:20px;
      color:#777;
      font-size:14px;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>⚡ Donasi Token Listrik</h2>

  <label>Nama Donatur</label>
  <input type="text" id="nama" placeholder="Masukkan Nama">

  <label>No Token Listrik</label>
  <input type="text" id="token" placeholder="Masukkan No Token">

  <button onclick="kirimWA()">Kirim ke WhatsApp</button>

  <div class="footer">
    Masjid Alfajri ✨ Donatur Muda
  </div>

</div>

<script>

function kirimWA(){

  let nama = document.getElementById("nama").value;
  let token = document.getElementById("token").value;

  let pesan =
`Assalamu’alaikum 🙏

Konfirmasi Donasi Token Listrik Masjid Alfajri

📌 Nama Donatur : ${nama}
📌 No Token : ${token}

Terima kasih atas donasi yang diberikan 🤲`;

  let nomor = "6281261727302";

  let url = `https://wa.me/${nomor}?text=${encodeURIComponent(pesan)}`;

  window.open(url, '_blank');
}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donasi Token Listrik Masjid Al Fajri</title>

  <style>
    body{
      margin:0;
      padding:20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg,#0f766e,#16a34a);
    }

    .container{
      max-width:430px;
      margin:auto;
      background:white;
      padding:30px;
      border-radius:22px;
      box-shadow:0 10px 25px rgba(0,0,0,0.2);
      margin-top:30px;
    }

    h2{
      text-align:center;
      color:#0f766e;
      margin-bottom:25px;
    }

    label{
      font-weight:bold;
      display:block;
      margin-top:15px;
      color:#333;
    }

    input{
      width:100%;
      padding:14px;
      margin-top:8px;
      border:1px solid #ccc;
      border-radius:12px;
      font-size:16px;
      box-sizing:border-box;
    }

    .token-box{
      margin-top:25px;
      background:#f0fdf4;
      padding:20px;
      border-radius:15px;
      text-align:center;
      border:2px dashed #16a34a;
    }

    .token-title{
      font-size:16px;
      font-weight:bold;
      color:#15803d;
    }

    .token-number{
      font-size:28px;
      font-weight:bold;
      margin-top:12px;
      color:#111;
      letter-spacing:2px;
    }

    button{
      width:100%;
      padding:15px;
      border:none;
      border-radius:12px;
      font-size:17px;
      font-weight:bold;
      cursor:pointer;
      margin-top:18px;
    }

    .copy-btn{
      background:#0f766e;
      color:white;
    }

    .copy-btn:hover{
      background:#115e59;
    }

    .wa-btn{
      background:#16a34a;
      color:white;
    }

    .wa-btn:hover{
      background:#15803d;
    }

    .footer{
      text-align:center;
      margin-top:20px;
      color:#777;
      font-size:14px;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>⚡ Donasi Token Listrik</h2>

  <label>Nama Donatur</label>
  <input type="text" id="nama" placeholder="Masukkan Nama Donatur">

  <label>Masukkan Token </label>
  <input type="text" id="token" placeholder="Masukkan Nomor Token">

  <div class="token-box">

    <div class="token-title">
      IDPEL Masjid Al Fajri
    </div>

    <div class="token-number" id="tokenMasjid">
      45120029124
    </div>

    <button class="copy-btn" onclick="copyToken()">
      📋 Copy Nomor Token
    </button>

  </div>

  <button class="wa-btn" onclick="kirimWA()">
    📲 Kirim Konfirmasi WhatsApp
  </button>

  <div class="footer">
    Masjid Al Fajri ✨ Donatur Muda
  </div>

</div>

<script>

function copyToken() {

  let token = "45120029124";

  navigator.clipboard.writeText(token);

  alert("Nomor Token Berhasil Disalin!");
}

function kirimWA(){

  let nama = document.getElementById("nama").value;
  let nomorWA = document.getElementById("token").value;

  let pesan =
`Assalamu’alaikum 🙏

Konfirmasi Donasi Token Listrik Masjid Al Fajri

📌 Nama Donatur : ${nama}
📌 Nomor WhatsApp : ${nomorWA}

📌 Token Listrik Masjid :
45120029124

Terima kasih atas donasi yang diberikan 🤲`;

  let nomorTujuan = "6281261727302";

  let url = `https://wa.me/${nomorTujuan}?text=${encodeURIComponent(pesan)}`;

  window.open(url, '_blank');
}

</script>

</body>
</html>
